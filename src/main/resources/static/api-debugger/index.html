<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>InterviewHQ</title>
  <link rel="stylesheet" href="/api-debugger/api-debugger.css">
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <div class="brand-mark">HQ</div>
      <div>
        <div class="brand-name">InterviewHQ</div>
        <div class="brand-subtitle">Interview experiences & questions</div>
      </div>
    </div>
    <div class="api-config">
      <label for="baseUrl">API</label>
      <div class="api-row">
        <input id="baseUrl" placeholder="http://localhost:8091">
        <button id="saveBase" class="secondary">Use</button>
      </div>
    </div>
  </div>
</header>

<nav class="main-nav">
  <div class="nav-inner">
    <button class="tab active" data-tab="experiences">Experiences</button>
    <button class="tab" data-tab="questions">Questions</button>
  </div>
</nav>

<main>
  <section id="experiences" class="panel active">
    <div class="page-heading">
      <div>
        <div class="eyebrow">Interview experiences</div>
        <h1>What candidates experienced</h1>
        <p>Browse recent interview experiences and open one to see the questions asked.</p>
      </div>
      <button class="primary" data-action="load-experiences">Refresh</button>
    </div>

    <div class="filters">
      <label>Company<input id="expCompany" placeholder="e.g. Amazon"></label>
      <label>Sort<select id="expSort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
      <label>Show<input id="expLimit" type="number" min="1" max="100" value="25"></label>
    </div>

    <div id="experienceList" class="experience-list"></div>
    <div id="experiencePagination" class="pagination"></div>

    <article id="experienceDetail" class="experience-detail hidden"></article>
  </section>

  <section id="questions" class="panel">
    <div class="page-heading">
      <div>
        <div class="eyebrow">Interview questions</div>
        <h1>Questions candidates were asked</h1>
        <p>Search the questions already available through the hq-API.</p>
      </div>
      <button class="primary" data-action="load-questions">Refresh</button>
    </div>

    <div class="filters">
      <label>Company<input id="qCompany" placeholder="e.g. Google"></label>
      <label>Question type<input id="qType" placeholder="e.g. DSA"></label>
      <label>Sort<select id="qSort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></label>
      <label>Show<input id="qLimit" type="number" min="1" max="100" value="25"></label>
    </div>

    <div id="questionList" class="question-list"></div>
    <div id="questionPagination" class="pagination"></div>
    <article id="questionDetail" class="question-detail hidden"></article>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script src="/api-debugger/api-debugger.js"></script>
</body>
</html>
