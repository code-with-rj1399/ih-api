server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ih-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ih-api
    description: InterviewHQ API — validates, deduplicates, and persists interview data
