server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: ih-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC

aws:
  region: ${AWS_REGION:ap-south-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table: ${DYNAMODB_TABLE:interviewhq-crawler-dev}
    experience-table: ${DYNAMODB_EXPERIENCE_TABLE:interviewhq-experiences-dev}
    question-table: ${DYNAMODB_QUESTION_TABLE:interviewhq-questions-dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: ih-api
    description: InterviewHQ backend API

api:
  cors:
    allowed-origins: ${API_CORS_ALLOWED_ORIGINS:http://localhost:3000}
