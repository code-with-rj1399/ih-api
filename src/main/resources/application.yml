server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: ih-api
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC
  lifecycle:
    timeout-per-shutdown-phase: 30s

ih:
  dynamodb:
    table: ${DYNAMODB_TABLE:interview-hq}
    region: ${AWS_REGION:ap-south-1}
    endpoint: ${DYNAMODB_ENDPOINT:}
    auto-create-table: ${DYNAMODB_AUTO_CREATE_TABLE:false}
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
  security:
    enabled: ${IH_SECURITY_ENABLED:true}
    header: ${IH_API_KEY_HEADER:X-API-Key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: ih-api
    description: InterviewHQ API — validates, deduplicates, and persists interview data
