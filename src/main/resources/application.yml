server:
  port: ${SERVER_PORT:8091}
  shutdown: graceful

spring:
  application:
    name: ih-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jackson:
    serialization:
      write-dates-as-timestamps: false
      write-date-timestamps-as-nanoseconds: false
    default-property-inclusion: non_null
    time-zone: UTC

aws:
  region: ${AWS_REGION:ap-south-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    table: ${DYNAMODB_TABLE:interviewhq-dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

info:
  app:
    name: ih-api
    description: InterviewHQ backend API
