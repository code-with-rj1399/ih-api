# Staging: AWS DynamoDB. Credentials come from the default provider chain
# (ECS/IRSA/instance role or exported AWS keys). Do not set DYNAMODB_ENDPOINT.
ih:
  dynamodb:
    table: ${DYNAMODB_TABLE:interview-hq-stg}
    endpoint: ${DYNAMODB_ENDPOINT:}
    auto-create-table: ${DYNAMODB_AUTO_CREATE_TABLE:false}
  security:
    enabled: ${IH_SECURITY_ENABLED:true}
